<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hidden System Log</title>
<style>
body{margin:0;background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;flex-direction:column}
.bar{width:320px;height:16px;border:1px solid #39ff14}.fill{height:100%;width:0;background:#39ff14;animation:load 3s forwards}
@keyframes load{to{width:100%}}
#main{display:none;padding:30px;max-width:900px;margin:auto}
.term{background:#161b22;border-radius:8px;border:1px solid #30363d}
.top{padding:10px;background:#21262d;color:#58a6ff}
.console{padding:18px;white-space:pre-wrap}
.folder{display:inline-block;margin:8px;padding:10px 16px;border:1px solid #58a6ff;border-radius:6px;cursor:pointer}
.folder:hover{background:#1f2937}
#msg{margin-top:20px;padding:18px;border:1px solid #30363d;background:#111827}
.cursor{animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="boot">
<h1>INITIALIZING...</h1>
<div class="bar"><div class="fill"></div></div>
<p id="status">Loading Birthday Modules...</p>
</div>

<div id="main">
<div class="term">
<div class="top">C:\Users\Prateek&gt; boot_teacher.exe</div>
<div class="console" id="type"></div>
</div>

<h2>📁 Memory Archive</h2>
<div>
<div class="folder" onclick="show(1)">Year 1</div>
<div class="folder" onclick="show(2)">Year 2</div>
<div class="folder" onclick="show(3)">Year 3</div>
<div class="folder" onclick="show(4)">Year 4</div>
<div class="folder" onclick="show(5)">Final Message ❤️</div>
</div>

<div id="msg">Select a folder above.</div>
<p>> logout(); <span class="cursor">█</span></p>
</div>

<script>
setTimeout(()=>{
document.getElementById('boot').style.display='none';
document.getElementById('main').style.display='block';
type("Access Granted ✔\nLoading Memories...\nWelcome, Ma'am. Happy Birthday! 🎉");
},3200);

function type(text){
let i=0,el=document.getElementById("type");
(function t(){
 if(i<text.length){el.textContent+=text.charAt(i++);setTimeout(t,25);}
})();
}

const data={
1:"📸 Year 1\n\n'I still remember our first meeting in the computer lab... the small boy came to the front.'",
2:"📚 Year 2\n\nEvery appreciation from you motivated me to learn more.",
3:"💻 Year 3\n\nYou didn't just teach IT—you built confidence.",
4:"🌟 Year 4\n\nThank you for your patience, guidance and inspiration.",
5:"❤️ Dear Ma'am,\n\nHappy Birthday! Thank you for debugging my doubts, upgrading my knowledge and believing in me. The  in the front will always be grateful for everything you've taught him.\n\n— Prateek Verma\n"
};
function show(n){document.getElementById('msg').innerText=data[n];}
</script>
</body>
</html>
